name: Unit tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/training
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - name: Install CPU test runtime
        run: |
          uv pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --no-sources -e . pytest
          .venv/bin/python -c "import torch; assert torch.version.cuda is None"
      - run: .venv/bin/python -m compileall -q src training scripts examples/serving tests
      - run: .venv/bin/python -m pytest -q tests serving/third_party/LightLLM/unit_tests/server/test_trajectory_budget.py
